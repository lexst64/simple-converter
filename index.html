<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/favicon-96x96.png?v=20260808" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260808" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260808" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260808" />
    <meta name="apple-mobile-web-app-title" content="Converter" />
    <link rel="manifest" href="/site.webmanifest?v=20260808" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simple Converter - Convert between media formats easily" />
    <meta name="theme-color" content="#ffffff" />

    <link href="/src/assets/styles.css" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme-store');
          let mode = 'auto';
          if (stored) {
            const parsed = JSON.parse(stored);
            if (parsed && parsed.themeMode) mode = parsed.themeMode;
          }
          const isDark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0f172a' : '#ffffff');
        } catch (e) {}
      })();
    </script>
    <title>Simple Converter | Easy Media Converter</title>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="app" class="min-h-screen flex flex-col font-sans"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
